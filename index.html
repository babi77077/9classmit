<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цахим нүүдэлчин — 9-р анги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE: сонирхолтой, итгэлтэй, 9-р ангийн өсвөр насныханд — тоглоомлог биш, адал явдалтай
   IDEA: шөнийн тэнгэрийн одны орд = алгоритмын зам; од бүр нэг алхам
   PICTURE: оддыг холбосон яст мэлхийн зам; лабораторид бодит зурах талбай
   COLOUR+TYPE: шөнийн гүн хөх (хоёр загварт), алтан од, тэнгэрийн цэнхэр; сургуулийн 4 өнгө; Nunito + PT Mono
   LAYOUT: дээд цэс → оддын зурагтай нүүр → эрхэм зорилго → зорилго → үнэт зүйл → ангийн одны орд */
:root{color-scheme:dark;--bg:#0d1330;--bg2:#121a42;--card:#18214f;--ink:#eef1ff;--mut:#a9b2dd;--gold:#ffcf4a;--sky:#5ad1ff;--red:#ff6b6b;--leaf:#4fd49a;--line:#2b3672;--soft:#212b5e;
--s1:#a46bf0;--s2:#4fc45a;--s3:#3d8df0;--s4:#f0b21a;--blk1:#3d8df0;--blk2:#4fc45a;--blk3:#f0b21a;--blk4:#a46bf0;--blk5:#ef6aa0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 80%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 85% 65%,#fff7 50%,transparent 51%);background-size:420px 420px}
h1,h2,h3{line-height:1.12;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,50px);font-weight:900}h2{font-size:clamp(25px,3vw,34px);font-weight:900}h3{font-size:20px;font-weight:800}
a{color:var(--sky)}
.band{padding:clamp(20px,3.5vw,44px) max(4vw,16px)}.wrap{max-width:1180px;margin:0 auto}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 18px;min-height:44px;cursor:pointer;background:var(--gold);color:#1a1640;box-shadow:0 4px 0 #b88a10;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a10}
button.ghost,.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 #0a0f26;border:2px solid var(--line)}
button.leaf{background:var(--leaf);box-shadow:0 4px 0 #2a8a5f}
button.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #a33}
button.sm{padding:6px 12px;min-height:38px;box-shadow:none;font-size:15px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);min-height:44px;width:100%}
label{font-weight:700;font-size:15px;display:block;margin:10px 0 4px}
.card{background:var(--card);border-radius:22px;padding:20px;border:2px solid var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.small{font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;background:var(--soft);color:var(--ink)}
.vchip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}
.note{font-size:14px;color:var(--mut);margin-top:8px}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:6px}.stripe i:nth-child(1){background:var(--s1)}.stripe i:nth-child(2){background:var(--s2)}.stripe i:nth-child(3){background:var(--s3)}.stripe i:nth-child(4){background:var(--s4)}
header{position:sticky;top:0;z-index:20;background:#0d1330ee;backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:8px max(4vw,16px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;color:var(--ink);text-decoration:none;margin-right:auto;line-height:1.05}
.logo small{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.badge130{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;padding:8px 11px;border-radius:12px}
nav a.on{background:var(--gold);color:#1a1640}
.who{font-size:14px;font-weight:800;background:var(--soft);padding:8px 12px;border-radius:12px;cursor:pointer;border:0;color:var(--ink);box-shadow:none;min-height:40px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:center}
.hero p{font-size:19px;max-width:34em}
.hero svg{width:100%;height:auto;max-height:440px}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;text-decoration:none;color:var(--ink);display:block}
.tile b{font-size:18px;display:block}.tile span{font-size:14px;color:var(--mut)}
.tile i{display:block;width:42px;height:42px;border-radius:14px;margin-bottom:10px}
.mission{background:var(--card);border-radius:26px;padding:clamp(20px,3vw,36px);border:2px solid var(--line)}
.mission .q{font-size:clamp(20px,2.4vw,27px);font-weight:700;line-height:1.4;margin:10px 0 0}
.goals{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.goal{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;border-top:8px solid var(--c)}
.goal .n{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:10px}
.vals{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.val{background:var(--c);color:#fff;border-radius:22px;padding:20px;min-height:190px;display:flex;flex-direction:column}
.val h3{font-size:23px;margin:6px 0 8px}.val p{margin:0;font-size:15px}.val .stat2{margin-top:auto;padding-top:12px;font-weight:900;font-size:15px}
.tree .r{display:grid;grid-template-columns:minmax(0,130px) minmax(50px,1fr) auto;gap:10px;align-items:center;margin:6px 0}
.tree .bar2{height:24px;border-radius:10px;background:var(--soft);overflow:hidden}.tree .bar2 i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--sky),var(--gold))}
.tree .v{font-weight:900;text-align:right;white-space:nowrap}.tree .r b{font-size:14px}
.lessons{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.les{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;color:var(--ink);box-shadow:none;font-weight:600;justify-content:flex-start;text-decoration:none}
.les .n{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--gold);color:#1a1640}
.les .n.done{background:var(--leaf);color:#0d1330}.les small{display:block;color:var(--mut);font-size:13px}
.les.lock{opacity:.55;cursor:not-allowed}.les.lock .n{background:var(--line);color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:8px 14px}
.tabs button.on{background:var(--sky);color:#0d1330;border-color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}.stat span{font-size:13px;color:var(--mut);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(5,8,25,.7);display:none;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal.on{display:grid}.modal .card{max-width:760px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.theory{max-width:860px}
.sec{border-radius:20px;padding:18px 20px;margin:16px 0;background:var(--card);border:2px solid var(--line)}
.sec h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:13px;font-weight:900;padding:4px 10px;border-radius:99px;color:#1a1640}
.t-o{background:#ffd98a}.t-m{background:#a6e3c4}.t-c{background:#b9d3ff}.t-h{background:#ffc2b8}.t-a{background:#e0cdff}.t-x{background:#ffe1a8}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}th{font-size:14px;color:var(--mut)}
.def{background:var(--soft);border-radius:16px;padding:12px 16px;font-weight:700;margin:10px 0;border-left:6px solid var(--gold)}
.fb{font-weight:700;margin-top:8px;min-height:1.4em}.fb.ok{color:var(--leaf)}.fb.no{color:var(--red)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.qcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.choice{display:flex;gap:10px;align-items:center;padding:10px 14px;border:2px solid var(--line);border-radius:14px;margin:6px 0;cursor:pointer;font-weight:600}
.choice input{width:22px;min-height:22px;flex:none}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:6px 0}
.ord{display:flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:14px;margin:6px 0;background:var(--bg2)}
.ord span{flex:1}.ord button{padding:4px 12px;min-height:38px;box-shadow:none}
.timer{position:sticky;top:70px;z-index:5;background:var(--sky);color:#0d1330;padding:10px 16px;border-radius:16px;font-weight:900;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rev{border-left:6px solid var(--leaf)}.rev.no{border-left-color:var(--red)}
.code{font-size:34px;font-weight:900;letter-spacing:6px;font-family:"PT Mono",monospace;color:var(--gold)}
.scroll{overflow-x:auto}
.terms .t{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.demo{font-size:13px;color:var(--mut);font-style:italic}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px}.chk input{width:22px;min-height:22px;flex:none;margin-top:2px}
summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
footer{padding:30px max(4vw,16px);color:var(--mut);font-size:14px;text-align:center}
/* лаборатори */
.lab{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,480px);gap:16px;align-items:start}
.pal{display:grid;gap:7px;align-content:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}.pal h4{margin:8px 0 0;font-size:13px;color:var(--mut)}
.blk{--c:var(--blk1);position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:7px;padding:8px 10px 9px;min-height:42px;font-weight:800;font-size:15px;cursor:grab;user-select:none;touch-action:none;box-shadow:inset 0 -3px 0 #0003}
.blk::before{content:'';position:absolute;top:0;left:16px;width:22px;height:6px;background:var(--bg2);border-radius:0 0 6px 6px}
.blk::after{content:'';position:absolute;bottom:-6px;left:16px;width:22px;height:6px;background:var(--c);border-radius:0 0 6px 6px;z-index:2}
.pal .blk::before{background:var(--card)}.pal .blk:active{cursor:grabbing}.pal .blk .cm{margin-left:auto;opacity:.7}
.blk .ic{font-size:15px;width:20px;text-align:center}
.blk input,.blk select{width:auto;min-height:30px;padding:2px 8px;font-size:15px;font-weight:800;border-radius:99px;background:#fff;border:0;color:#1a1640;max-width:140px;cursor:text}
.blk input.num{width:64px;text-align:center}
.blk .x{margin-left:auto;background:#0003;color:#fff;box-shadow:none;min-height:28px;width:28px;padding:0;font-size:13px;border-radius:50%;opacity:.55}.blk:hover .x,.blk .x:focus-visible{opacity:1}
.prog{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:14px 14px 18px;min-height:380px;background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:18px 18px}
.prog.tgt,.mouth.tgt{outline:2px dashed var(--gold);outline-offset:2px}
.hat{position:relative;display:inline-flex;align-items:center;gap:6px;min-width:150px;background:var(--leaf);color:#0d1330;font-weight:900;padding:12px 14px 9px;border-radius:22px 22px 7px 7px;box-shadow:inset 0 -3px 0 #0002}
.hat::after{content:'';position:absolute;bottom:-6px;left:16px;width:22px;height:6px;background:var(--leaf);border-radius:0 0 6px 6px;z-index:2}
.endcap{position:relative;display:inline-flex;min-width:150px;background:#ff8a8a;color:#2a0d0d;font-weight:900;padding:9px 14px;border-radius:7px 7px 18px 18px;margin-top:0}
.endcap::before{content:'';position:absolute;top:0;left:16px;width:22px;height:6px;background:var(--bg2);border-radius:0 0 6px 6px}
.bw{position:relative}.bw.cb{background:var(--c);border-radius:7px;box-shadow:inset 0 -3px 0 #0003}
.cb>.blk{box-shadow:none;border-radius:7px 7px 0 0}.cb>.blk::after{left:32px}
.mouth{margin-left:16px;background:var(--bg2);min-height:40px;padding:0 0 6px;border-radius:0 0 0 6px;position:relative}
.mouth .hint{display:block;padding:12px 10px 6px;font-size:13px;color:var(--mut);font-weight:700}
.mid{position:relative;color:#fff;font-weight:800;padding:6px 10px 8px;font-size:14px}
.mid::after{content:'';position:absolute;bottom:-6px;left:32px;width:22px;height:6px;background:var(--c);border-radius:0 0 6px 6px;z-index:2}
.foot{position:relative;height:16px;border-radius:0 0 7px 7px}
.foot::after{content:'';position:absolute;bottom:-6px;left:16px;width:22px;height:6px;background:var(--c);border-radius:0 0 6px 6px;z-index:2}
.dragghost{position:fixed;z-index:100;pointer-events:none;opacity:.9;transform:rotate(2deg);filter:drop-shadow(0 8px 14px #0008)}
.dragghost .blk::before{background:transparent}
.dropline{position:fixed;z-index:99;height:6px;border-radius:6px;background:var(--gold);box-shadow:0 0 0 2px #1a1640,0 0 12px var(--gold);pointer-events:none}
body.dragging{cursor:grabbing;user-select:none}
.fcbox{background:#0a0f26;border:2px solid var(--line);border-radius:18px;padding:12px;overflow:auto;max-height:620px;display:flex;justify-content:center}
.fcbox[hidden],.canvas[hidden],.words[hidden]{display:none}
.fcbox svg{flex:none}.fl{stroke:#a9b2dd;stroke-width:2}.fct{fill:#a9b2dd;font-size:11px;font-weight:700}
.fcleg{display:flex;flex-wrap:wrap;gap:12px 18px}.fcleg span{display:flex;align-items:center;gap:8px;font-weight:700}
.sh{display:inline-block;width:46px;height:24px;background:var(--blk1)}.sh.zuiv{border-radius:12px;background:var(--leaf)}.sh.par{transform:skewX(-20deg);background:var(--blk4)}.sh.hex{background:var(--blk3);clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%)}.sh.rom{width:34px;height:34px;background:var(--blk5);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pic{margin:10px 0 2px;background:#fff;border-radius:12px;overflow:hidden;max-width:440px;border:2px solid var(--line)}.pic svg{display:block;width:100%;height:auto}.pic.big{max-width:620px}
.where{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:900;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--wc) 22%,transparent);color:var(--wc);border:2px solid var(--wc);vertical-align:middle}
.wgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}.wcard{border:2px solid var(--wc);border-radius:16px;padding:12px;background:color-mix(in srgb,var(--wc) 10%,transparent)}.wcard .wi{font-size:28px;display:block}.wcard b{display:block;color:var(--wc);font-size:17px}.wcard small{display:block;font-size:13px;color:var(--mut)}.wcard .wn{color:var(--ink);font-weight:800;margin-top:4px}
.outc{margin-top:14px;background:var(--bg2);border:2px dashed var(--gold);border-radius:16px;padding:12px 14px}.outc p{margin:8px 0 0}
.sres{margin-top:8px;background:#4fd49a18;border-left:4px solid var(--leaf);border-radius:8px;padding:6px 10px;font-size:15px}
.talk{margin:0;padding-left:20px}.talk li{margin:8px 0}
.notes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}.notes p{margin:0;background:var(--bg2);border-radius:14px;padding:10px 14px;font-style:italic}
.fsmode{background:var(--bg);padding:30px;overflow:auto;font-size:20px}.fsmode h3{font-size:26px}.fsmode .small{font-size:17px}
.me{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.mini span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:14px}.mini b{color:var(--gold);font-size:18px}
.olist{display:grid;gap:6px;margin-top:8px;max-height:260px;overflow:auto}.olist a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--bg2);border-radius:12px;padding:8px 10px;font-weight:700}
.olist small{display:block;color:var(--mut);font-weight:600;font-size:12px}.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:900}.dot.ok{background:var(--leaf);color:#0d1330}
.oprow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}.oprow:last-child{border:0}
.selfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.faces{display:flex;gap:6px}.face{flex-direction:column;gap:0;background:var(--bg2);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:4px 8px;min-width:88px;min-height:56px}.face span{font-size:22px;line-height:1.1}.face small{font-size:11px;font-weight:700;color:var(--mut)}
.face.on{border-color:var(--gold);background:#ffcf4a22}.face.on small{color:var(--gold)}
.rate{display:flex;gap:4px}.rate button{background:none;box-shadow:none;color:var(--line);font-size:34px;padding:0 4px;min-height:44px}.rate button.on{color:var(--gold)}
.starsv{color:var(--gold);letter-spacing:1px}
.sbar{display:flex;height:26px;border-radius:10px;overflow:hidden;background:var(--soft)}.sbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:900;color:#0d1330;white-space:nowrap;overflow:hidden}
.canvas{background:#0a0f26;border:2px solid var(--line);border-radius:18px;overflow:hidden;position:relative;aspect-ratio:6/5}
.canvas canvas{width:100%;height:100%;display:block}
.out{background:#0a0f26;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-family:"PT Mono",monospace;min-height:60px;white-space:pre-wrap;font-size:15px}
.words{font-size:14px;background:var(--bg2);border-radius:14px;padding:10px 14px;border:2px solid var(--line)}
.words ol{margin:0;padding-left:22px}
.task{border:2px solid var(--gold);border-radius:18px;padding:14px;background:#ffcf4a12;margin-bottom:12px}
.tasks{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tasks button{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:6px 12px;min-height:38px}
.tasks button.on{border-color:var(--gold)}.tasks button.ok{background:var(--leaf);color:#0d1330}
/* ажлын хуудас */
.ws{max-width:880px}
.wsh{background:linear-gradient(135deg,#1d2a6b,#2a1f5c);border-radius:22px;padding:22px;border:2px solid var(--line)}
.wsh .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:12px}

const AR_PTS=p=>p>=80?5:p>=50?3:1;
const AR_LBL=p=>p>=80?'Сайн':p>=50?'Дутуу':'Хангалтгүй';
const AR_LEVELS=[[0,'Шинэ хурга'],[25,'Хичээнгүй тугал'],[60,'Мэргэн малчин'],[120,'Хурдан хүлэг'],[200,'Цахим нүүдэлчин']];
function aaruul(u){if(!u)return {total:0,it:[]};const pc=r=>r&&r.total?Math.round(r.score/r.total*100):0;const it=[];
 Object.entries(u.theory||{}).forEach(([id,r])=>{if(r)it.push({d:r.date||'',k:'Бататгах дасгал',t:(TH.find(x=>x.id===id)||{}).t||id,p:pc(r)})});
 Object.entries(u.ltest||{}).forEach(([id,r])=>{if(r)it.push({d:r.date||'',k:'Хичээлийн шалгалт',t:(TH.find(x=>x.id===id)||{}).t||id,p:pc(r)})});
 Object.entries(u.ws||{}).forEach(([id,r])=>{if(r&&r.total)it.push({d:r.date||'',k:'Ажлын хуудас',t:(WS.find(x=>x.id===id)||{}).t||id,p:pc(r)})});
 Object.entries(u.exams||{}).forEach(([n,a])=>{const r=a?.[0];if(r)it.push({d:r.date||'',k:'Нэгжийн шалгалт',t:n+' '+unitName(n),p:pc(r)})});
 Object.entries(u.netq||{}).forEach(([id,r])=>{if(r)it.push({d:r.d||'',k:'Сүлжээний лаборатори',t:((window.NetLab&&NetLab.TASKS.find(t=>t.id===id))||{t:id}).t.split(':')[0],p:100})});
 it.forEach(x=>x.a=AR_PTS(x.p));it.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
 return {total:it.reduce((s,x)=>s+x.a,0),it}}
const arLevel=t=>{let L0=AR_LEVELS[0],nx=null;for(const l of AR_LEVELS){if(t>=l[0])L0=l;else{nx=l;break}}return {cur:L0,next:nx}};
function arRank(u){const cls=Object.values(users).filter(x=>x.cls===u.cls&&(!x.test||x.id===u.id)).map(x=>({id:x.id,t:aaruul(x).total})).sort((a,b)=>b.t-a.t);return {rank:cls.findIndex(x=>x.id===u.id)+1,n:cls.length}}
function jarSVG(t,goal){const k=Math.max(.06,Math.min(1,goal?t/goal:1)),h=150*k;return `<svg viewBox="0 0 200 230" role="img" aria-label="Ааруулын сав ${t}"><path d="M40 40 h120 v18 q22 10 22 40 v100 q0 24 -24 24 h-116 q-24 0 -24 -24 v-100 q0 -30 22 -40z" fill="#fffdf6" stroke="#8a6a3a" stroke-width="5"/>
 <clipPath id="jarc"><path d="M42 60 q-20 10 -20 38 v100 q0 22 22 22 h112 q22 0 22 -22 v-100 q0 -28 -20 -38z"/></clipPath>
 <g clip-path="url(#jarc)">${Array.from({length:Math.round(k*28)},(_,i)=>{const r=Math.floor(i/5),c=i%5;return `<rect x="${32+c*28+(r%2)*10}" y="${196-r*22}" width="24" height="18" rx="5" fill="${i%3?'#fff4d6':'#fffaf0'}" stroke="#c8a66a" stroke-width="2"/>`}).join('')}</g>
 <rect x="32" y="22" width="136" height="22" rx="8" fill="#c8102e" stroke="#7d0a1c" stroke-width="3"/><path d="M40 33h120" stroke="#ffcf4a" stroke-width="3" stroke-dasharray="6 5"/></svg>`}
function arChart(it){if(!it.length)return '<p class="mut">Одоохондоо ааруул алга. Эхний хичээлээ хийгээд илгээгээрэй!</p>';let s=0;const pts=[];const byD={};it.forEach(x=>{s+=x.a;byD[x.d||'—']=s});const ks=Object.keys(byD);const mx=Math.max(...Object.values(byD),5);
 const W=560,H=200,px=i=>30+(ks.length<2?W/2-30:i*(W-50)/(ks.length-1)),py=v=>H-24-v/mx*(H-44);
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Ааруулын өсөлт"><line x1="30" y1="${H-24}" x2="${W-10}" y2="${H-24}" stroke="#ead9b9" stroke-width="2"/>
 <polygon points="30,${H-24} ${ks.map((k,i)=>`${px(i)},${py(byD[k])}`).join(' ')} ${px(ks.length-1)},${H-24}" fill="#e8a21a33"/>
 <polyline points="${ks.map((k,i)=>`${px(i)},${py(byD[k])}`).join(' ')}" fill="none" stroke="#c8102e" stroke-width="3.5" stroke-linejoin="round"/>
 ${ks.map((k,i)=>`<circle cx="${px(i)}" cy="${py(byD[k])}" r="5" fill="#fff" stroke="#c8102e" stroke-width="3"/><text x="${px(i)}" y="${py(byD[k])-10}" text-anchor="middle" font-size="12" font-weight="800" fill="#2a1a10">${byD[k]}</text><text x="${px(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#7a6650">${k.slice(5)}</text>`).join('')}</svg>`}
V.aaruul=()=>{const u=user();if(!u)return `<section class="band"><div class="wrap" style="max-width:640px"><div class="card" style="text-align:center"><h2>${arIco()} Ааруулын сав</h2><p>Хичээл, ажлын хуудас, шалгалтаа илгээх бүрд ааруул цуглуулна. Эхлээд нэвтэрнэ үү.</p><a class="btn" href="#login">Нэвтрэх</a></div></div></section>`;

 ${rankOn()?(()=>{const cl=Object.values(users).filter(x=>x.cls===u.cls&&(!x.test||x.id===u.id)).map(x=>({x,t:aaruul(x).total})).sort((a,b)=>b.t-a.t);const me2=cl.findIndex(z=>z.x.id===u.id);return `<div class="card rankcard" style="margin-top:16px"><h3>🏅 ${esc(u.cls)} ангийн ааруулын эрэмбэ</h3>${cl.slice(0,10).map((z,i)=>`<div class="rkl ${z.x.id===u.id?'me':''}"><b class="rkn r${i<3?i+1:0}">${i+1}</b><span style="flex:1">${esc(z.x.ner)} ${esc(z.x.ovog.slice(0,1))}.</span><b>${z.t} 🧀</b></div>`).join('')}${me2>=10?`<div class="rkl me"><b class="rkn">${me2+1}</b><span style="flex:1">Би</span><b>${cl[me2].t} 🧀</b></div>`:''}</div>`})():''}
 <div class="card" style="margin-top:16px"><h3>Цол</h3><div class="badges">${AR_LEVELS.map(l=>`<span class="badge ${A.total>=l[0]?'got':''}">${arIco()} ${esc(l[1])}<small class="mut">${l[0]}+</small></span>`).join('')}</div></div>
 <div class="card" style="margin-top:16px"><h3>Ааруул хэрхэн өсч байна вэ?</h3>${arChart(A.it)}</div>
 <div class="card" style="margin-top:16px"><h3>Сүүлд цуглуулсан ааруул</h3>${A.it.length?[...A.it].reverse().slice(0,30).map(x=>`<div class="ar-row"><span class="small mut">${esc(x.d||'—')}</span><span><b>${esc(x.t)}</b><br><span class="small mut">${esc(x.k)}</span></span><span class="small ar-p">${x.p}% · ${AR_LBL(x.p)}</span><span class="ar-pts">+${x.a} ${arIco()}</span></div>`).join(''):'<p class="mut">Одоохондоо алга.</p>'}</div>

ap year.", "7. Гурвалжин байгуулах уу": "7. Can it be a triangle?", "Гурван тал оруулахад гурвалжин байгуулж болох бол «болно», үгүй бол «болохгүй» гэж хэвлэ.": "Enter three sides; print «болно» (yes) if they can form a triangle, otherwise «болохгүй» (no).", "8. 1-ээс N хүртэлх нийлбэр": "8. Sum from 1 to N", "N оруулахад 1 + 2 + … + N нийлбэрийг For давталтаар олж хэвлэ.": "Enter N and find the sum 1 + 2 + … + N with a For loop.", "9. Үржвэрийн хүснэгт": "9. Multiplication table", "Тоо оруулахад түүний 1-ээс 10 хүртэлх үржвэрийг 10 мөрөнд хэвлэ. Жишээ:": "Enter a number and print its products from 1 to 10 on 10 lines. Example:", "10. Цифрийн нийлбэр": "10. Sum of digits", "Натурал тоо оруулахад цифрүүдийн нийлбэрийг While давталтаар олж хэвлэ.": "Enter a natural number and find the sum of its digits with a While loop.", "Math.Remainder(n, 10) — сүүлийн цифр, Math.Floor(n / 10) — түүнийг хасна.": "Math.Remainder(n, 10) — the last digit, Math.Floor(n / 10) — removes it.", "11. Хадгаламж": "11. Savings", "Мөнгө жилд 12%-иар өсдөг. Эхний мөнгө оруулахад хэдэн жилийн дараа 2 дахин буюу түүнээс их болохыг хэвлэ.": "Money grows 12% per year. Enter the starting amount and print after how many years it becomes double or more.", "Жил бүр m = m * 1.12.": "Each year m = m * 1.12.", "12. Тоо таах (оролт шалгах)": "12. Guess the number (input check)", "Хэрэглэгчээс 1–10 хооронд тоо асуу. Завсраас гадуур бол дахин асуу. Зөв тоо оруулахад «Баярлалаа» гэж хэвлээд тэр тоог хэвлэ.": "Ask the user for a number from 1 to 10. If it is out of range, ask again. When a correct number is entered, print «Баярлалаа» (thank you) and the number.", "Шошго, Goto эсвэл While ашигла.": "Use a label with Goto, or While.", "13. Гэр зурах": "13. Draw a house", "GraphicsWindow-оор дор хаяж 1 тэгш өнцөгт, 1 гурвалжин зурж гэр бүтээ.": "With GraphicsWindow draw at least 1 rectangle and 1 triangle to build a house.", "14. Тугийн суурь": "14. Flag background", "Улаан, цэнхэр, улаан гурван босоо тэгш өнцөгт const ROOTS=window.LAB_ROOTS||'.labpage>.wrap,.kwrap,.sb,.hl,.pcl,.bnl,.dsg,.nl,.fl,.pt,.dbl,.anl,.aul,.vdl,.mm-card,.fl-dlgin,.sl:not(.sl-player)';
const SKIP=new Set(['TEXTAREA','SCRIPT','STYLE','CODE','PRE','CANVAS','SVG']);
const SKIPCLS=['sb-con','nl-term','nl-con','fl-con'];
const KEY='lab_lang';let lang='mn';try{lang=localStorage.getItem(KEY)||'mn'}catch(e){}
const keys=Object.keys(DICT).filter(k=>k.trim().length>=2).sort((a,b)=>b.length-a.length);
const escR=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const L='А-Яа-яЁёӨөҮү';
const RE=new RegExp('(?<!['+L+'])('+keys.map(escR).join('|')+')(?!['+L+'])','g');
const CYR=/[А-Яа-яЁёӨөҮү]/;
function tr(s){if(!s||!CYR.test(s))return s;const t=s.trim();if(DICT[t]!==undefined)return s.replace(t,DICT[t]);return s.replace(RE,m=>DICT[m]??m)}
function skip(n){for(let p=n.parentNode;p&&p.nodeType===1;p=p.parentNode){if(SKIP.has(p.nodeName.toUpperCase()))return true;if(p.classList&&SKIPCLS.some(c=>p.classList.contains(c)))return true}return false}
function walk(root){if(lang!=='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const L2=[];while(w.nextNode())L2.push(w.currentNode);
 L2.forEach(n=>{if(!CYR.test(n.nodeValue)||skip(n))return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
 root.querySelectorAll&&root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v&&CYR.test(v))e.setAttribute(a,tr(v))}))}
function bar(){const d=document.createElement('div');d.className='lang-bar';d.innerHTML=`<span>Хэл / Language</span><button data-l="mn" class="${lang==='mn'?'on':''}">Монгол</button><button data-l="en" class="${lang==='en'?'on':''}">English</button>`;
 d.querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem(KEY,lang)}catch(e){}try{window.onLabLang&&window.onLabLang(lang)}catch(e){}const y=scrollY;if(typeof render==='function')render();setTimeout(()=>scrollTo(0,y),30)});return d}
function scan(root){(root.matches&&root.matches(ROOTS)?[root]:[]).concat([...(root.querySelectorAll?root.querySelectorAll(ROOTS):[])]).forEach(r=>{
  if(!r.matches('.mm-card,.fl-dlgin')&&!r.parentElement?.closest(ROOTS)){if(r.matches('.wrap')){const f=r.firstElementChild;if(!f||!f.classList.contains('lang-bar'))r.insertBefore(bar(),f)}else{const p=r.previousElementSibling;if(!p||!p.classList.contains('lang-bar'))r.parentNode.insertBefore(bar(),r)}}
  walk(r)})}
let busy=false;const mo=new MutationObserver(ms=>{if(busy)return;busy=true;try{ms.forEach(m=>{m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.closest&&n.closest(ROOTS)&&lang==='en')walk(n);scan(n)}else if(n.nodeType===3&&lang==='en'&&n.parentNode&&n.parentNode.closest&&n.parentNode.closest(ROOTS)&&!skip(n)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}});if(m.type==='characterData'&&lang==='en'){const n=m.target;if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest(ROOTS)&&!skip(n)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}}})}finally{busy=false}});
const go=()=>{try{window.onLabLang&&window.onLabLang(lang)}catch(e){}scan(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true})};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
window.labLang=()=>lang;
})();
